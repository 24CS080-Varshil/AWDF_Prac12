services:
  frontend:
    build:
      context: ./TaskManager-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - taskmanager-network

  backend:
    build:
      context: ./TaskManagerAPI
    env_file:
      - ./TaskManagerAPI/.env
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/taskmanager
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskmanager-network

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - taskmanager-network

volumes:
  mongodb_data:

networks:
  taskmanager-network:
    driver: bridge
